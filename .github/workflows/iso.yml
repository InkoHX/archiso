name: ISO

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release"
        type: boolean
        default: false
  schedule:
    - cron: "0 0 1 * *"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: archlinux:base@sha256:4bf33b21a715aac0b48ce6e9eaed4782a898eae96f88f5da3635572129c2584a
      options: --privileged
    steps:
      - name: Restore pacman cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/pacman/pkg
          key: pacman-cache-${{ github.workflow }}-build

      - name: Install dependencies
        run: pacman -Syyu --needed --noconfirm archiso git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Apply patches
        run: ./scripts/apply-patches.sh

      - name: Build ISO
        run: mkarchiso -v -o ./out ./releng

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iso-files
          path: ./out/*.iso

  relase:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'schedule' || github.event.inputs.release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: iso-files
          path: ./out

      - name: Generate Release Info
        id: release-info
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ./out/*.iso
          name: ${{ steps.release-info.outputs.date }}
          tag_name: ${{ steps.release-info.outputs.date }}
          draft: ${{ github.event_name != 'schedule' }}
